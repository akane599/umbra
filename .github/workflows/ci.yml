name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Also validates the Gradle wrapper jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint, release build (unsigned)
        run: ./gradlew --no-daemon test lintRelease assembleRelease
